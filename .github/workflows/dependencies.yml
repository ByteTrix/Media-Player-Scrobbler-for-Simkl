name: Dependency Management

on:
  schedule:
    - cron: '0 0 * * 1'  
  workflow_dispatch:
  pull_request:
    paths:
      - 'pyproject.toml'
      - 'poetry.lock'

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        
      - name: Dependency Review
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: critical
          fail-on-scopes: runtime
          vulnerability-check: true

  # Dependency update PRs are managed weekly by Dependabot (.github/dependabot.yml).
  # This scheduled job verifies that the locked dependency set installs cleanly
  # and passes dependency and unit tests on Linux.
  verify-dependencies:
    name: Verify Dependencies
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip

      - name: Install Poetry and locked dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "poetry==2.5.1"
          poetry check --lock
          poetry install --with dev --no-interaction

      - name: Run Comprehensive Dependency Tests
        env:
          PYSTRAY_BACKEND: dummy
          PYTHONIOENCODING: utf-8
        run: poetry run python test_dependencies.py --ci

      - name: Run Project Tests
        env:
          PYSTRAY_BACKEND: dummy
          PYTHONIOENCODING: utf-8
        run: |
          TEST_HOME="${RUNNER_TEMP}/test-home"
          mkdir -p "${TEST_HOME}"
          HOME="${TEST_HOME}" \
          XDG_CONFIG_HOME="${TEST_HOME}/.config" \
          XDG_DATA_HOME="${TEST_HOME}/.local/share" \
          poetry run pytest -q --ignore=test_build.py --ignore=test_potplayer.py
