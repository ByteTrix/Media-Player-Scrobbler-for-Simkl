name: PR Checks

on:
  pull_request:
    # 'edited' re-validates the title after it is renamed in the GitHub UI.
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: read

concurrency:
  # A title-only edit must not cancel an in-flight test run and then skip tests.
  group: pr-checks-${{ github.event.pull_request.number }}-${{ github.event.action == 'edited' && github.event.changes.base == null && 'title' || 'code' }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    permissions:
      pull-requests: read
    steps:
      - name: Validate Conventional Commits
        uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            fix
            feat
            chore
            refactor
            rf
            rm
            del
            build
            docs
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            The subject "{subject}" found in the pull request title "{title}"
            didn't match the configured pattern. Please ensure that the subject
            doesn't start with an uppercase character.
          githubBaseUrl: https://api.github.com
          ignoreLabels: |
            bot
            ignore-semantic-pull-request
          headerPattern: '^(\w*)(?:\(([\w$.\-*/ ]*)\))?: (.*)$'
          headerPatternCorrespondence: type, scope, subject

  labeler:
    runs-on: ubuntu-latest
    # Pull requests from forks only receive a read-only GITHUB_TOKEN, so adding
    # labels fails with 403. Skip them instead of reporting a false failure.
    # Title/body edits do not change files, so only re-label on base changes.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event.action != 'edited' || github.event.changes.base != null)
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: PR Size Labeler
        uses: codelytv/pr-size-labeler@v1
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          xs_label: 'size/xs'
          xs_max_size: '10'
          s_label: 'size/s'
          s_max_size: '100'
          m_label: 'size/m'
          l_label: 'size/l'
          l_max_size: '1000'
          xl_label: 'size/xl'
          fail_if_xl: 'false'

      - name: PR Labeler
        uses: actions/labeler@v7
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          sync-labels: true

  tests:
    runs-on: windows-latest
    if: >-
      github.event.pull_request.draft == false &&
      (github.event.action != 'edited' || github.event.changes.base != null)
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install locked dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install "poetry==2.5.1" "poetry-plugin-export==1.10.1"
          poetry check --lock
          poetry export --with dev -f requirements.txt -o "$env:RUNNER_TEMP\requirements-dev.txt"
          python -m pip install --require-hashes -r "$env:RUNNER_TEMP\requirements-dev.txt"
          python -m pip install --no-deps -e .

      - name: Run unit tests
        shell: pwsh
        run: |
          # Isolate app data so tests never touch a real profile or credentials.
          $testHome = Join-Path $env:RUNNER_TEMP 'test-home'
          New-Item -ItemType Directory -Force -Path $testHome | Out-Null
          $env:USERPROFILE = $testHome
          $env:HOME = $testHome
          $env:APPDATA = Join-Path $testHome 'AppData\Roaming'
          $env:LOCALAPPDATA = Join-Path $testHome 'AppData\Local'
          $env:PYTHONIOENCODING = 'utf-8'
          # test_build.py checks PyInstaller output and needs a built dist folder.
          python -m pytest -q --ignore=test_build.py
